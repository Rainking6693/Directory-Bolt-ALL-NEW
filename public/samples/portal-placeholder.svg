<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ccff0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8d500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5f5"/>
  
  <!-- Border -->
  <rect width="400" height="300" fill="none" stroke="#ddd" stroke-width="1"/>
  
  <!-- Top Nav -->
  <rect width="400" height="50" fill="url(#grad3)"/>
  <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000">
    DirectoryBolt Portal
  </text>
  
  <!-- Sidebar -->
  <rect x="0" y="50" width="100" height="250" fill="#f0f0f0" stroke="#ddd"/>
  <text x="10" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">
    Menu
  </text>
  <line x1="10" y1="85" x2="90" y2="85" stroke="#ddd"/>
  
  <!-- Menu items -->
  <text x="10" y="105" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Dashboard
  </text>
  <text x="10" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Reports
  </text>
  <text x="10" y="145" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Submissions
  </text>
  <text x="10" y="165" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Settings
  </text>
  
  <!-- Main content area -->
  <g>
    <!-- Content header -->
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
      Your Submissions
    </text>
    
    <!-- Content lines -->
    <line x1="120" y1="105" x2="380" y2="105" stroke="#ddd"/>
    <line x1="120" y1="125" x2="380" y2="125" stroke="#ddd"/>
    <line x1="120" y1="145" x2="380" y2="145" stroke="#ddd"/>
    <line x1="120" y1="165" x2="380" y2="165" stroke="#ddd"/>
    
    <!-- Status boxes -->
    <rect x="120" y="180" width="70" height="40" fill="#ccff0a" stroke="#999" opacity="0.3"/>
    <text x="130" y="195" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Submitted
    </text>
    <text x="130" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      24
    </text>
    
    <rect x="210" y="180" width="70" height="40" fill="#a8d500" stroke="#999" opacity="0.3"/>
    <text x="220" y="195" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Pending
    </text>
    <text x="220" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      8
    </text>
    
    <rect x="300" y="180" width="70" height="40" fill="#00d084" stroke="#999" opacity="0.3"/>
    <text x="310" y="195" font-family="Arial, sans-serif" font-size="10" fill="#333">
      Complete
    </text>
    <text x="310" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
      16
    </text>
  </g>
</svg>
